<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>HAND SCULPTOR</title>
<meta name="description" content="手で 3D を つくる ブラウザAR">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ikemotodir.github.io/hand-sculptor/">
<meta property="og:title" content="HAND SCULPTOR｜手で、ホログラムをつくる">
<meta property="og:description" content="カメラの前で手を合わせて、ひらくと3Dが生まれる。ブラウザで動くAR・インストール不要。">
<meta property="og:image" content="https://ikemotodir.github.io/hand-sculptor/icons/og-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#00040c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HAND SCULPTOR">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="stylesheet" href="./css/app.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script>
// Support check (classic script, runs before the module): importmap + WebGL2 are required.
(function () {
  var ok = true;
  try {
    ok = !!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'));
    if (ok) { var c = document.createElement('canvas'); ok = !!(c.getContext && c.getContext('webgl2')); }
  } catch (e) { ok = false; }
  window.__hsSupported = ok;
  if (!ok) document.addEventListener('DOMContentLoaded', function () {
    var s = document.getElementById('start');
    if (s) s.innerHTML = '<div class="st-wrap"><div class="st-title">HAND SCULPTOR</div>' +
      '<div class="st-err"><b>ブラウザを 最新にしてね</b><span>最新の Chrome か Safari で</span></div></div>';
  });
})();
</script>
</head>
<body>
  <video id="cam" muted playsinline autoplay></video>
  <canvas id="gl"></canvas>
  <canvas id="overlay"></canvas>
  <div id="hud"></div>
  <div id="start">
    <div class="st-wrap"><div class="st-title">HAND SCULPTOR</div><div class="st-cap">LOADING</div></div>
  </div>
  <noscript><div class="st-err" style="position:fixed;inset:auto 16px 40px">JavaScript を オンにしてね</div></noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
